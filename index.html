<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tokio Marine UAE | Claim portal (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans','Noto Sans Arabic',system-ui,sans-serif;color:#1A2733;background:#F5F7F9}
button,input{font-family:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #0F62AC;outline-offset:3px}
[dir=rtl] .flip{transform:scaleX(-1)}
.shell{width:100%;min-height:100vh;background:#F5F7F9;display:flex;flex-direction:column}
.langbtn{border:none;background:none;padding:0 8px;min-height:44px;font-size:14px;color:#4E5E6E;cursor:pointer}
.hdr{background:#FFFFFF;border-bottom:1px solid #D9E3EC;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.page{width:100%;max-width:700px;margin:0 auto;padding:24px 16px 32px 16px;display:flex;flex-direction:column;gap:18px;flex:1}
.card{background:#FFFFFF;border:1px solid #D9E3EC;border-radius:20px;padding:24px 20px 20px 20px;box-shadow:0 1px 2px rgba(11,61,92,.05),0 12px 32px rgba(11,61,92,.07);display:flex;flex-direction:column;gap:14px}
.headline{margin:0;font-family:Montserrat,'Noto Kufi Arabic','Noto Sans',sans-serif;font-weight:600;font-size:23px;line-height:1.35;color:#0B3D5C}
.sub{margin:0;font-size:15px;line-height:1.55;color:#4E5E6E}
.lbl{font-size:14px;font-weight:600;color:#0B3D5C}
.inp{width:100%;height:56px;border:1.5px solid #C5D3E0;border-radius:12px;padding:0 16px;font-size:16px;color:#1A2733;background:#FFFFFF;text-align:start}
.inp:focus{border-color:#0F62AC}
.otp{height:64px;text-align:center;font-family:Montserrat,'Noto Sans',sans-serif;font-size:28px;font-weight:600;letter-spacing:.5em;padding-inline-start:.5em;color:#0B3D5C}
.chan{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 16px;border-radius:14px;font-size:16px;color:#1A2733;text-align:start}
.next{min-height:52px;min-width:140px;padding:0 28px;border:none;border-radius:999px;font-size:16px;font-weight:600;margin-inline-start:auto}
.link{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;border:none;background:none;color:#0F62AC;font-size:15px;font-weight:600}
.cap{font-size:12px;line-height:1.35;color:#4E5E6E}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin:0}
.fact{display:flex;align-items:center;gap:10px;min-width:0}
.fact .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.fact .k{font-size:12px;line-height:1.35;color:#4E5E6E}
.fact .v{font-size:14px;line-height:1.4;font-weight:500;color:#1A2733}
.fact.wide{grid-column:1/-1}
.ico{width:34px;height:34px;border-radius:999px;background:#EAF4FA;display:flex;align-items:center;justify-content:center;flex:none}
.chip{min-height:44px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:600}
.grp{margin:6px 0 0 0;font-family:Montserrat,'Noto Kufi Arabic','Noto Sans',sans-serif;font-weight:600;font-size:18px;line-height:1.35;color:#0B3D5C}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
@media (min-width:640px){
  .hdr{padding:14px 40px}
  .page{padding:40px 24px 48px 24px;gap:22px}
  .card{padding:36px 36px 28px 36px;gap:16px}
  .headline{font-size:28px}
  .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fact.wide{grid-column:auto}
}
</style>
</head>

      if (el) {
        el.focus();
        if (typeof caret === 'number' && el.setSelectionRange) { try { el.setSelectionRange(caret, caret); } catch (e) {} }
      }
    }
  }

  // ---- Actions ----
  function submit() {
    var locked = S.attempts >= 3;
    if (S.step === 'login') {
      if ((S.policy || '').trim() === '') return;
      var v = norm(S.policy);
      if (POLICY_RE.test(v)) set({ step: 'channel', policy: v, err: null });
      else set({ err: 'policy' });
    } else if (S.step === 'channel') {
      if (!S.channel) return;
      set({ step: 'otp', code: '', attempts: 0, err: null, notice: null });
    } else if (S.step === 'otp') {
      if (S.code.length !== 6 || locked) return;
      if (S.code !== WRONG_CODE) set({ step: 'claims', code: '', err: null, notice: null });
      else set({ attempts: S.attempts + 1, code: '', err: 'code', notice: null });
    }
  }

  var app = document.getElementById('app');

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var key = t.getAttribute('data-key');
    if (act === 'lang-en') set({ lang: 'en' });
    else if (act === 'lang-ar') set({ lang: 'ar' });
    else if (act === 'channel') set({ channel: key });
    else if (act === 'filter') set({ filter: key });
    else if (act === 'resend') set({ notice: 'resent', code: '', err: null });
    else if (act === 'change') set({ step: 'channel', code: '', err: null, notice: null });
    else if (act === 'back') set({ step: S.step === 'otp' ? 'channel' : 'login', code: '', err: null, notice: null });
    else if (act === 'signout') set({ step: 'login', policy: '', channel: null, code: '', attempts: 0, err: null, notice: null, filter: 'all' });
  });

  app.addEventListener('input', function (e) {
    if (e.target.id === 'policy') set({ policy: e.target.value, err: null });
    else if (e.target.id === 'otp') {
      if (S.attempts >= 3) return;
      set({ code: String(e.target.value || '').replace(/\D/g, '').slice(0, 6), err: null, notice: null });
    }
  });

  app.addEventListener('submit', function (e) {
    e.preventDefault();
    submit();
  });

  render();
})();
</script>
</body>
</html>
